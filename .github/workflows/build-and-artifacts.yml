# Builds a debug APK and a source ZIP on every push (and manual run).
# Download artifacts from: repo → Actions → latest workflow run.
# Pages demo still deploys from workflows/pages.yml on master.

name: Build APK and source archive

on:
  push:
    paths:
      - 'android-app/**'
      - 'docs/**'
      - '.github/workflows/build-and-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source archive (ZIP of tree at this commit)
        run: git archive --format=zip -o "hotel-management-v2-${{ github.sha }}.zip" HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: hotel-management-v2-${{ github.sha }}.zip
          retention-days: 90

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for Gradle
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
